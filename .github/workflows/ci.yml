name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conditions
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/conditions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lake-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/lake_model/requirements.txt
      - run: pip install -r jobs/lake_model/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: jobs/lake_model

  # Agent evals call the real model, so they run only when the prompt, rules or model change and a key is set.
  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(src/server/agent/|src/lib/reasons\.ts|seed/rules\.ts|seed/thresholds\.ts|evals/|packages/engine/src/)'; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        run: npm ci && npm run evals
      - if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY == ''
        run: echo "::warning::Agent files changed but ANTHROPIC_API_KEY is not set as a repository secret, so the evals did not run."

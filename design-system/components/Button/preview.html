<!doctype html><html><head><meta charset="utf-8"><title>Button</title></head><body>
<div class="mr-col-demo">
<div class="mr-row-demo" style="padding:0">
<button class="mr-btn mr-btn-primary"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg> New issue <span class="mr-kbd">C</span></button>
<button class="mr-btn mr-btn-secondary"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg> Filter</button>
<button class="mr-btn mr-btn-ghost">Display</button>
<button class="mr-btn mr-btn-ghost mr-btn-icon" aria-label="More actions"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="12.5" cy="8" r="1.2"/></svg></button>
<button class="mr-btn mr-btn-danger">Delete issue</button>
</div>
<div class="mr-row-demo" style="padding:0">
<button class="mr-btn mr-btn-secondary mr-btn-sm">Small</button>
<button class="mr-btn mr-btn-secondary">Default</button>
<button class="mr-btn mr-btn-primary mr-btn-lg">Create project</button>
<button class="mr-btn mr-btn-secondary" disabled>Disabled</button>
</div></div></body></html>

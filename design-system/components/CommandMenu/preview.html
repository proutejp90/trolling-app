<!doctype html><html><head><meta charset="utf-8"><title>CommandMenu</title></head><body>
<div style="padding:var(--space-4)">
<div class="mr-cmd" role="dialog" aria-label="Command menu">
<div class="mr-cmd-input"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><span class="mr-placeholder">Type a command or search…</span><span class="mr-kbd">Esc</span></div>
<div class="mr-cmd-list">
<div class="mr-cmd-group">Actions</div>
<div class="mr-cmd-item is-active"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg> Create issue<span class="mr-kbd-group"><span class="mr-kbd">C</span></span></div>
<div class="mr-cmd-item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.8-2.5 2.7-3.5 5-3.5s4.2 1 5 3.5"/></svg> Assign to me<span class="mr-kbd-group"><span class="mr-kbd">I</span></span></div>
<div class="mr-cmd-group">Navigation</div>
<div class="mr-cmd-item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 9.5 3.8 3h8.4L14 9.5V13H2z"/><path d="M2 9.5h3.5l1 1.5h3l1-1.5H14"/></svg> Go to inbox<span class="mr-kbd-group"><span class="mr-kbd">G</span><span class="mr-kbd">I</span></span></div>
<div class="mr-cmd-item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg> Go to projects<span class="mr-kbd-group"><span class="mr-kbd">G</span><span class="mr-kbd">P</span></span></div>
</div>
<div class="mr-cmd-foot"><span><span class="mr-kbd">↑</span> <span class="mr-kbd">↓</span> to navigate</span><span><span class="mr-kbd">↵</span> to select</span></div>
</div></div></body></html>
